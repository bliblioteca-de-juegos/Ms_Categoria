spring:
  application:
    name: ms-categoria
  # Configuración de base de datos usando la variable de entorno de Render
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  # Configuración de JPA para PostgreSQL
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # Flyway habilitado
  flyway:
    enabled: true
    baseline-on-migrate: true

# Configuración de servidor (usando puerto dinámico para Render)
server:
  port: ${PORT:8081}

eureka:
  client:
    service-url:
      default-zone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

ms:
  juegos:
    url: ${JUEGOS_SERVICE_URL:http://localhost:8082}